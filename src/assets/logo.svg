<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Web Club Logo">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" in="SourceGraphic"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="220" fill="url(#logoGrad)" filter="url(#glow)"/>
  <!-- Globe orbit ring -->
  <ellipse cx="256" cy="256" rx="160" ry="75" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" transform="rotate(-18 256 256)"/>
  <ellipse cx="256" cy="256" rx="160" ry="75" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3" transform="rotate(22 256 256)"/>
  <!-- Link nodes -->
  <circle cx="256" cy="120" r="28" fill="#ffffff"/>
  <circle cx="128" cy="340" r="20" fill="#ffffff" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="384" cy="340" r="20" fill="#ffffff" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="128" cy="170" r="14" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="384" cy="170" r="14" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Connecting link lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85" fill="none">
    <line x1="256" y1="148" x2="128" y2="340"/>
    <line x1="256" y1="148" x2="384" y2="340"/>
    <line x1="128" y1="170" x2="256" y2="120"/>
    <line x1="384" y1="170" x2="256" y2="120"/>
    <line x1="128" y1="170" x2="384" y2="170"/>
    <line x1="128" y1="340" x2="384" y2="340"/>
  </g>
  <!-- Center diamond -->
  <polygon points="256,190 280,256 256,322 232,256" fill="#ffffff" fill-opacity="0.92"/>
</svg>
